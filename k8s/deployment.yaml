apiVersion: apps/v1
kind: Deployment
metadata:
  name: demand-ml
  labels:
    app: demand-ml
    version: "0.1.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: demand-ml
  template:
    metadata:
      labels:
        app: demand-ml
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: demand-ml
        image: demand-ml:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: MLFLOW_TRACKING_URI
          value: "file:./mlruns"
        - name: DATA_DIR
          value: "/data"
        - name: MODEL_DIR
          value: "/models"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: models
          mountPath: /models
        - name: data
          mountPath: /data
      volumes:
      - name: models
        emptyDir: {}
      - name: data
        emptyDir: {}
